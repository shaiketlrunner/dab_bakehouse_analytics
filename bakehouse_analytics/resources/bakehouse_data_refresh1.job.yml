# A sample job for bakehouse_analytics.

resources:
  jobs:
    bakehouse_data_refresh:
      name: bakehouse_data_refresh1

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: customer-360
          environment_key: default
          python_wheel_task:
            package_name: bakehouse_analytics
            entry_point: main
            parameters:
              - "--catalog"
              - "{{job.parameters.catalog}}"
              - "--schema"
              - "{{job.parameters.schema}}"

        - task_key: transactions_summary
          environment_key: default
          depends_on:
            - task_key: customer-360
          python_wheel_task:
            package_name: bakehouse_analytics
            entry_point: main
            parameters:
              - "--catalog"
              - "{{job.parameters.catalog}}"
              - "--schema"
              - "{{job.parameters.schema}}"

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
